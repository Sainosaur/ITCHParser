name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install NVC
        run: |
          sudo apt-get update
          wget https://github.com/nickg/nvc/releases/download/r1.23.0/nvc_1.23.0-1_amd64_ubuntu-24.04.deb
          sudo apt install ./nvc_1.23.0-1_amd64_ubuntu-24.04.deb
          nvc --version

      - name: Install Python deps
        run: pip install cocotb

      - name: Run tests
        run: |
          ls
          cd test
          make
