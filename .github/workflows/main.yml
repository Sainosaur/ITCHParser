name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install NVC
        run: |
          sudo apt-get update
          sudo apt-get install -y nvc
          nvc --version

      - name: Install Python deps
        run: pip install cocotb

      - name: Run tests
        run: make
