name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: 'pip' # Optional: Caches your pip dependencies for faster runs

      # Better approach: Installs NVC cleanly without wget/deb hassles
      - name: Install NVC
        uses: nickg/setup-nvc@v1
        with:
          version: '1.23.0'

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install cocotb --user

      - name: Run tests
        run: |
          cd test
          make
